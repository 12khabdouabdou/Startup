name: cwl_app
description: Construction Waste Logistics
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^13.0.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # Pin app_links to avoid AGP 8.x compatibility issue in newer versions
  app_links: 6.1.4

flutter:
  uses-material-design: true
