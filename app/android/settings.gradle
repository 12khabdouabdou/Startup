pluginManagement {
    def flutterSdkPath = {
        def env = System.getenv()
        def sdkPath = env.get("FLUTTER_ROOT") ?: env.get("FLUTTER_HOME")
        if (sdkPath == null) {
            def properties = new Properties()
            def localPropertiesFile = file("local.properties")
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withInputStream { properties.load(it) }
                sdkPath = properties.getProperty("flutter.sdk")
            }
        }
        assert sdkPath != null, "Flutter SDK not found. Set FLUTTER_ROOT or add flutter.sdk to android/local.properties"
        return sdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
