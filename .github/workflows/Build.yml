name: Build EcoRoute App

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ecoroute**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'ecoroute**'
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    # IMPORTANT: Linux is case-sensitive! 
    # If your folders are capitalized (e.g., Startup/EcoRoute), 
    # you MUST update this path to match exactly.
    defaults:
      run:
        working-directory: ecoroute

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Build Release APK
        run: flutter build apk --release

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoroute-release-apk
          # This path must also match your exact folder capitalization
          path: startup/ecoroute/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
