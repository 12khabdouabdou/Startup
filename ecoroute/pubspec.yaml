name: ecoroute
description: Construction waste logistics platform connecting developers, haulers, and recyclers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    intl: ^0.20.2

  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Backend
  supabase_flutter: ^2.5.0
  
  # Offline Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.0
  
  # Maps
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^1.4.0
  
  # Geolocation
  geolocator: ^13.0.0
  
  # Networking
  dio: ^5.4.0
  
  # Code Generation
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  
  # Dependency Injection
  get_it: ^8.0.0
  
  # Functional Programming
  dartz: ^0.10.0
  
  # Notifications
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  
  # Image Handling
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  
  # File Handling
  file_picker: ^6.0.0
  path_provider: ^2.1.0
  
  # URL Launching
  url_launcher: ^6.3.0
  
  # PDF Generation
  pdf: ^3.11.0
  printing: ^5.12.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
