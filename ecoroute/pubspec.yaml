name: ecoroute
description: Construction waste logistics platform connecting developers, haulers, and recyclers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.6.0

  # Backend
  supabase_flutter: ^2.6.0

  # Offline Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0

  # Geolocation
  geolocator: ^13.0.2

  # Networking
  dio: ^5.7.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.2

  # Dependency Injection
  get_it: ^8.0.3

  # Functional Programming
  dartz: ^0.10.1

  # Notifications
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # File Handling
  file_picker: ^8.1.4
  path_provider: ^2.1.5

  # URL Launching
  url_launcher: ^6.3.1

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  hive_generator: ^2.0.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/
